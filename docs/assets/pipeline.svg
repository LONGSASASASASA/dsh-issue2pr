<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 830" role="img" aria-labelledby="pt">
  <title id="pt">dsh-issue2pr 11 阶段流水线：主流程 P1→P9→P11，复核门 P5/P6/P9/P11，失败旁路 P10</title>
  <rect width="1360" height="830" fill="#F3EFE6"/>

  <!-- ===== 页头 ===== -->
  <rect x="48" y="46" width="9" height="9" fill="#2A3F7A"/>
  <text x="66" y="55" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="12" letter-spacing="2.5" fill="#2A3F7A">PIPELINE · MAIN FLOW P1→P9→P11 + FAILURE BYPASS P10</text>
  <text x="48" y="96" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="25" fill="#171820">11 阶段流水线：每一步有自己的输入契约与产物</text>
  <text x="48" y="124" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6F6B78">触发源（GitHub / GitLab Issue 或本地需求文档）从 P1 进入；关键阶段停下等人工复核，任一阶段失败进入 P10 分类。</text>

  <!-- 图例 -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2B2D3A">
    <path d="M760 94 H792" stroke="#8A8578" stroke-width="1.8" marker-end="url(#i2p-ink)"/>
    <text x="802" y="98">主流程</text>
    <path d="M876 94 H908" stroke="#A6453A" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#i2p-warn)"/>
    <text x="918" y="98">失败旁路</text>
    <rect x="990" y="83" width="58" height="20" rx="10" fill="#2A3F7A"/>
    <text x="1019" y="97" text-anchor="middle" font-size="10.5" fill="#FFFFFF">复核门</text>
    <text x="1056" y="98">需人工通过</text>
    <text x="1160" y="98" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#A07A1F">01–11 产物</text>
  </g>

  <!-- ===== 阶段列标题 ===== -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="12" letter-spacing="2" fill="#2A3F7A">
    <text x="60" y="160">01 理解 · UNDERSTAND</text>
    <text x="390" y="160">02 规划执行 · PLAN &amp; ACT</text>
    <text x="720" y="160">03 验证 · VERIFY</text>
    <text x="1050" y="160">04 交付 · DELIVER</text>
  </g>

  <!-- ===== 连接线（画在卡片下层） ===== -->
  <g stroke="#8A8578" stroke-width="1.8" fill="none">
    <!-- 列内垂直 -->
    <path d="M170 262 V290" marker-end="url(#i2p-ink)"/>
    <path d="M170 388 V416" marker-end="url(#i2p-ink)"/>
    <path d="M170 514 V542" marker-end="url(#i2p-ink)"/>
    <path d="M500 262 V290" marker-end="url(#i2p-ink)"/>
    <path d="M500 388 V416" marker-end="url(#i2p-ink)"/>
    <path d="M830 262 V290" marker-end="url(#i2p-ink)"/>
    <!-- 跨列折线（进入下一列首行） -->
    <path d="M280 594 H335 V216 H384" marker-end="url(#i2p-ink)"/>
    <path d="M610 468 H665 V216 H714" marker-end="url(#i2p-ink)"/>
    <path d="M940 342 H995 V216 H1044" marker-end="url(#i2p-ink)"/>
    <!-- P11 → Gate 评测 -->
    <path d="M1160 262 V290" marker-end="url(#i2p-ink)"/>
  </g>
  <!-- 失败旁路：任一阶段失败 → P10 -->
  <path d="M830 388 V644" stroke="#A6453A" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#i2p-warn)"/>
  <text x="844" y="560" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#A6453A">任一阶段失败</text>

