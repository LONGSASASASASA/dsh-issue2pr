<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="bt">
  <title id="bt">dsh-issue2pr — 从一条 Issue 到一份被合并的 PR，中间不能跳步</title>
  <!-- 纸面档案底色（沿用 issue2pr-research.html 的设计语言） -->
  <rect width="1200" height="420" fill="#F3EFE6"/>
  <rect x="14" y="14" width="1172" height="392" fill="none" stroke="#DCD6C7" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#E8E2D3" stroke-width="1"/>

  <!-- 眉题 -->
  <rect x="48" y="56" width="9" height="9" fill="#2A3F7A"/>
  <text x="66" y="65" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" letter-spacing="3.5" fill="#2A3F7A">EVIDENCE-CHAINED · ISSUE → PULL REQUEST</text>

  <!-- 标题与口号 -->
  <text x="46" y="132" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-weight="700" font-size="58" fill="#171820">dsh-issue2pr</text>
  <text x="48" y="172" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-weight="600" font-size="20" fill="#2B2D3A">从一条 Issue 到一份被合并的 PR，中间不能跳步。</text>
  <text x="48" y="198" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#6F6B78">An 11-stage, review-gated pipeline that turns an issue into a mergeable, evidence-chained pull request.</text>

  <!-- 档案印章 -->
  <g transform="translate(1000 130) rotate(-7)">
    <rect x="-84" y="-27" width="168" height="54" rx="6" fill="#F3E1DC" fill-opacity="0.6" stroke="#A6453A" stroke-width="2.5"/>
    <rect x="-77" y="-20" width="154" height="40" rx="4" fill="none" stroke="#A6453A" stroke-width="1.2"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="15" letter-spacing="5" fill="#A6453A">每一步可审查</text>
  </g>

  <!-- 主流程条：Issue → P1..P11 → Pull Request -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="13.5">
    <rect x="48" y="258" width="92" height="36" rx="18" fill="#FBF8F1" stroke="#171820" stroke-width="1.8"/>
    <text x="94" y="281" text-anchor="middle" fill="#171820">Issue</text>
    <path d="M146 276 H164" stroke="#8A8578" stroke-width="1.8" marker-end="url(#mi2p-arrow)"/>
    <!-- P1..P11（P5/P6/P9/P11 为复核门：藏青底；P10 失败旁路：砖红虚线） -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="14">
      <rect x="172" y="258" width="56" height="36" rx="7" fill="#FFFFFF" stroke="#C9C2B2" stroke-width="1.3"/><text x="200" y="281" text-anchor="middle" fill="#2B2D3A">P1</text>
      <rect x="241" y="258" width="56" height="36" rx="7" fill="#FFFFFF" stroke="#C9C2B2" stroke-width="1.3"/><text x="269" y="281" text-anchor="middle" fill="#2B2D3A">P2</text>
      <rect x="310" y="258" width="56" height="36" rx="7" fill="#FFFFFF" stroke="#C9C2B2" stroke-width="1.3"/><text x="338" y="281" text-anchor="middle" fill="#2B2D3A">P3</text>
      <rect x="379" y="258" width="56" height="36" rx="7" fill="#FFFFFF" stroke="#C9C2B2" stroke-width="1.3"/><text x="407" y="281" text-anchor="middle" fill="#2B2D3A">P4</text>
      <rect x="448" y="258" width="56" height="36" rx="7" fill="#2A3F7A" stroke="#15214A" stroke-width="1"/><text x="476" y="281" text-anchor="middle" fill="#FFFFFF">P5</text>
      <rect x="517" y="258" width="56" height="36" rx="7" fill="#2A3F7A" stroke="#15214A" stroke-width="1"/><text x="545" y="281" text-anchor="middle" fill="#FFFFFF">P6</text>
      <rect x="586" y="258" width="56" height="36" rx="7" fill="#FFFFFF" stroke="#C9C2B2" stroke-width="1.3"/><text x="614" y="281" text-anchor="middle" fill="#2B2D3A">P7</text>
      <rect x="655" y="258" width="56" height="36" rx="7" fill="#FFFFFF" stroke="#C9C2B2" stroke-width="1.3"/><text x="683" y="281" text-anchor="middle" fill="#2B2D3A">P8</text>
      <rect x="724" y="258" width="56" height="36" rx="7" fill="#2A3F7A" stroke="#15214A" stroke-width="1"/><text x="752" y="281" text-anchor="middle" fill="#FFFFFF">P9</text>
      <rect x="793" y="258" width="56" height="36" rx="7" fill="#F3E1DC" stroke="#A6453A" stroke-width="1.3" stroke-dasharray="5 4"/><text x="821" y="281" text-anchor="middle" fill="#7C362E">P10</text>
      <rect x="862" y="258" width="56" height="36" rx="7" fill="#2A3F7A" stroke="#15214A" stroke-width="1"/><text x="890" y="281" text-anchor="middle" fill="#FFFFFF">P11</text>
    </g>
    <path d="M922 276 H940" stroke="#8A8578" stroke-width="1.8" marker-end="url(#mi2p-arrow)"/>
    <rect x="946" y="258" width="106" height="36" rx="18" fill="#FBF8F1" stroke="#171820" stroke-width="1.8"/>
    <text x="999" y="281" text-anchor="middle" fill="#171820">Pull Request</text>
  </g>
  <text x="597" y="322" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11.5" fill="#6F6B78">深色底 = 人工复核门（P5 · P6 · P9 · P11）&#160;&#160;&#160;虚线 = 失败旁路（P10 · 仅失败时执行）</text>

  <!-- 分隔线与五条不变命题 -->
  <line x1="48" y1="352" x2="1152" y2="352" stroke="#DCD6C7" stroke-width="1"/>
  <text x="600" y="388" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-weight="600" font-size="15.5" letter-spacing="1" fill="#171820">不可跳步 · 可定位 · 可回滚 · 可审查 · 可复现</text>
  <text x="1152" y="388" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#6F6B78">ARTIFACTS 01–11</text>

  <defs>
    <marker id="mi2p-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
  </defs>
</svg>
