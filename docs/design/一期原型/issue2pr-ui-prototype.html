<!doctype html>
<html lang="zh-CN">
<head>

    <title>Issue2PR · V9</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --surface: #ffffff;
            --soft: #f3f5f7;
            --ink: #1c2833;
            --secondary: #596875;
            --muted: #72808a;
            --line: #e7ebed;
            --border: #d7dfe2;
            --accent: #177b62;
            --accent-hover: #10624e;
            --accent-soft: #eaf4ef;
            --amber: #986318;
            --amber-soft: #fbf3e4;
            --red: #bb4346;
            --red-soft: #fcf0f0;
            --blue: #426b9c;
            --blue-soft: #edf3fb;
            --terminal: #18232b;
            --term-text: #d6e4e9;
            --shadow: 0 16px 64px #18232b1f;
            --font: var(--dsw-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI",
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
                Helvetica, Arial, sans-serif);
            --mono: var(--ds-font-family-code, "SF Mono", "JetBrains Mono", "Fira Code",
                Consolas, "Liberation Mono", Menlo, Courier, "PingFang SC", "Microsoft YaHei");
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #141b20;
            --surface: #1a2329;
            --soft: #222e35;
            --ink: #e5edf0;
            --secondary: #b6c3ca;
            --muted: #94a5af;
            --line: #2a373f;
            --border: #41515b;
            --accent: #79cbb0;
            --accent-hover: #a2e1ca;
            --accent-soft: #203c34;
            --amber: #e8bd76;
            --amber-soft: #383023;
            --red: #f09598;
            --red-soft: #3c272d;
            --blue: #97bbed;
            --blue-soft: #26374b;
            --terminal: #111a21;
            --shadow: 0 16px 64px #0005;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            --content-delta: calc(var(--dsh-content-font-size, 14px) - 14px);
            --content-secondary: var(--dsh-content-font-size-secondary,
                min(calc(var(--dsh-content-font-size, 14px) - 1px),
                    max(13px, calc(var(--dsh-content-font-size, 14px) - 2px))));
            font: var(--dsh-content-font-size, 14px) / calc(24px + var(--content-delta)) var(--font);
            color: var(--ink); background: var(--bg);
        }
        button, input, textarea, select { font: inherit; color: inherit; }
        button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        button { border: 0; background: none; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        h1, h2, h3, p { margin: 0; }
        h1 { font: 700 calc(21px + var(--content-delta)) / calc(30px + var(--content-delta)) var(--font); }
        h2 { font: 500 16px/24px var(--font); }
        h3 { font: 500 14px/22px var(--font); }
        small, .small { font-size: 12px; }
        .muted { color: var(--muted); }
        .secondary { color: var(--secondary); }
        .mono, code, pre { font-family: var(--mono); }
        .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
        .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .between { justify-content: space-between; }
        .wrap { flex-wrap: wrap; }
        .grow { flex: 1; min-width: 0; }
        .stack { display: grid; gap: 16px; }
        .hidden, [hidden] { display: none !important; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            min-height: 36px; padding: 6px 13px; border: 1px solid var(--border);
            background: var(--surface); border-radius: 7px; white-space: nowrap;
            font-weight: 500; text-decoration: none; transition: background .15s;
        }
        .btn:hover { background: var(--soft); text-decoration: none; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
        html[data-theme="dark"] .btn.primary { color: #10291f; }
        .btn.primary:hover { background: var(--accent-hover); }
        .btn.ghost { border-color: transparent; background: transparent; }
        .btn.ghost:hover { background: var(--soft); }
        .btn.danger { color: var(--red); }
        .btn.compact { min-height: 30px; padding: 3px 9px; font-size: 12px; }
        .icon-btn { width: 34px; height: 34px; padding: 8px; border-radius: 7px; flex: none; }
        .icon-btn:hover { background: var(--soft); }
        .icon-btn .icon { width: 18px; height: 18px; }
        .badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
            background: var(--soft); border-radius: 5px; font-size: 12px; white-space: nowrap;
            color: var(--secondary); font-weight: 500;
        }
        .badge.good { color: var(--accent); background: var(--accent-soft); }
        .badge.warn { color: var(--amber); background: var(--amber-soft); }
        .badge.bad { color: var(--red); background: var(--red-soft); }
        .badge.blue { color: var(--blue); background: var(--blue-soft); }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .field {
            width: 100%; min-height: 40px; border: 1px solid var(--border); border-radius: 7px;
            background: var(--surface); padding: 8px 11px; min-width: 0;
        }
        textarea.field { resize: vertical; min-height: 100px; line-height: 1.7; }
        .field::placeholder { color: var(--muted); }
        label.label { display: grid; gap: 7px; font-weight: 500; }
        .label small { color: var(--secondary); font-weight: 400; }
        .search { position: relative; }
        .search > .icon { position: absolute; left: 11px; top: 11px; color: var(--muted); }
        .search input { padding-left: 37px; }
        .app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100dvh; }
        .app.host-collapsed { grid-template-columns: 64px minmax(0, 1fr); }
        .host {
            background: var(--bg); border-right: 1px solid var(--line); min-height: 0;
            display: flex; flex-direction: column; padding: 19px 15px 12px;
        }
        .host-brand { margin-bottom: 26px; padding: 0 4px; }

        .host-item {
            display: flex; align-items: center; gap: 9px; padding: 10px; text-align: left;
            border-radius: 7px; width: 100%; color: var(--secondary); margin: 2px 0;
        }
        .host-item:hover { background: var(--line); }
        .host-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
        .host-session { padding: 10px 12px; font-size: 13px; color: var(--secondary); }
        .host-session.selected { background: var(--line); border-radius: 7px; }
        .host-bottom { margin-top: auto; padding-top: 20px; }
        .profile { margin-top: 18px; padding: 12px 5px 0; border-top: 1px solid var(--line); }
        .avatar {

            border-radius: 50%; background: #e4e9ec; color: #4a606d; font-size: 12px;
        }
        .host-collapsed .host { padding-left: 10px; padding-right: 10px; align-items: center; }
        .host-collapsed .host-wide { display: none; }
        .host-collapsed .host-brand { flex-direction: column; gap: 15px; padding: 0; }
        .host-collapsed .host-item { justify-content: center; padding: 10px; width: 42px; }
        .host-collapsed .new-session { padding: 8px; }
        .shell { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
        .topbar {
            height: 64px; flex: none; padding: 0 28px; display: flex; align-items: center;
            gap: 26px; border-bottom: 1px solid var(--line); background: var(--surface);
        }
        .product-brand { font-size: 18px; font-weight: 700; letter-spacing: -.7px; gap: 10px; }
        .product-brand .icon { color: var(--accent); width: 22px; height: 22px; }
        .top-nav { display: flex; align-self: stretch; gap: 24px; margin-left: 12px; }
        .top-nav button { position: relative; color: var(--secondary); padding: 0 3px; }
        .top-nav button.active { color: var(--ink); font-weight: 600; }
        .top-nav button.active::after {
            content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: var(--accent); border-radius: 2px;
        }
        .top-tools { margin-left: auto; }
        .main { display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; }
        .task-header { padding: 16px 26px 12px; background: var(--surface); flex: none; }
        .breadcrumb { font-size: 12px; margin-bottom: 10px; color: var(--muted); }
        .breadcrumb button { padding: 0; color: var(--secondary); font-size: 12px; }
        .task-title-row { gap: 16px; }
        .task-title-row h1 { flex: 1; font: 500 16px/24px var(--font); }
        .issue-number { color: var(--muted); font-weight: 400; margin-right: 9px; }
        .task-meta { margin-top: 11px; gap: 16px; color: var(--secondary); font-size: 12px; }
        .task-meta .icon { width: 14px; height: 14px; }
        .status-notice {
            color: var(--accent); padding-left: 16px; border-left: 1px solid var(--border);
            font-size: 13px;
        }
        .status-notice.warn { color: var(--amber); }
        .status-notice.bad { color: var(--red); }
        .topology { padding: 8px 28px 0; background: var(--surface); flex: none; }
        .track { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px; }
        .stage-slot { position: relative; min-width: 0; }
        .stage-slot .stage { width: 100%; height: 100%; }
        .stage-slot .instance-picker {
            position: absolute; bottom: 4px; left: 5%; width: 90%; min-height: 23px;
            font-size: 12px; padding: 1px 2px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 4px; z-index: 2;
        }
        .history-pin {
            position: absolute; right: -6px; top: -6px; font-size: 10px; font-style: normal;
            width: 15px; height: 15px; border-radius: 50%; color: var(--surface);
            background: var(--red); border: 2px solid var(--surface);
            display: grid; place-items: center; line-height: 1;
        }
        .return-lane { color: var(--amber); margin-bottom: 9px; }
        .return-lane > svg { width: 100%; height: 36px; display: block; overflow: visible; }
        .return-lane button { padding: 3px 10px; width: 100%; border-radius: 5px; }
        .return-lane .return-label { background: var(--amber-soft); }
        .return-lane.suggested { color: var(--red); }
        .return-lane.suggested .return-label { background: var(--red-soft); }
        .return-lane path { vector-effect: non-scaling-stroke; }
        .stage {
            position: relative; display: flex; flex-direction: column; align-items: center;
            padding: 9px 1px 8px; border-radius: 8px; border: 1px solid transparent; min-width: 0;
        }
        .stage:hover { background: var(--soft); }
        .stage.chosen { border-color: #9fc9ba; background: var(--accent-soft); }
        .stage-mark {
            border: 1px solid var(--border); background: var(--surface); width: 23px; height: 23px;
            display: grid; place-items: center; border-radius: 50%; color: var(--muted);
            position: relative; z-index: 1; margin-bottom: 7px; font-size: 11px;
        }
        .stage-mark .icon { width: 13px; height: 13px; }
        .stage::before {
            content: ""; height: 1px; background: var(--line); width: calc(100% + 8px);
            position: absolute; left: -51%; top: 20px;
        }
        .stage-slot:first-child .stage::before { display: none; }
        .stage.done .stage-mark { background: var(--accent-soft); color: var(--accent); border: 0; }
        .stage.current .stage-mark { background: var(--accent); border: 0; color: var(--surface); }
        .stage.failed .stage-mark { background: var(--red); border: 0; color: var(--surface); }
        .stage.waiting .stage-mark { background: var(--amber-soft); color: var(--amber); }
        .stage-name { font-size: 13px; line-height: 1.5; text-align: center; }
        .stage-code { color: var(--muted); font-size: 12px; margin-top: 3px; }
        .stage.current .stage-code { color: var(--accent); }
        .track-footer { height: 31px; display: flex; align-items: center; justify-content: space-between; }
        .track-footer button { font-size: 12px; color: var(--secondary); }
        .track-footer .failure-link { color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .track-footer .failure-link.active { color: var(--red); }
        .task-tabs {
            display: flex; align-items: center; gap: 25px; padding: 0 28px; height: 49px;
            border-bottom: 1px solid var(--line); background: var(--surface); flex: none;
        }
        .task-tabs > button { align-self: stretch; padding: 0 1px; color: var(--secondary); }
        .task-tabs > button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .task-tabs .files-button { margin-left: auto; align-self: center; }
        .workspace { min-height: 0; flex: 1; background: var(--surface); overflow: auto; }
        .work-grid {
            display: grid; grid-template-columns: minmax(0, 1fr) 282px; gap: 32px;
            padding: 20px 26px 28px; min-height: 100%; align-items: start;
        }
        .work-main { min-width: 0; }
        .section-heading { margin-bottom: 18px; }
        .section-heading p { color: var(--secondary); margin-top: 4px; }
        .stage-eyebrow { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
        .section-actions { margin-top: 18px; }
        .card { border: 1px solid var(--line); border-radius: 10px; padding: 19px; }
        .soft-card { background: var(--bg); border-radius: 10px; padding: 18px; }
        .card + .card { margin-top: 16px; }
        .evidence { display: grid; gap: 19px; }
        .evidence h3 { margin-bottom: 13px; }
        .eyebrow { font-size: 11px; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; }
        .file-link {
            display: flex; gap: 10px; align-items: center; width: 100%; padding: 11px 0;
            border-bottom: 1px solid var(--line); text-align: left;
        }
        .file-link:last-child { border-bottom: 0; }
        .file-link > .icon { color: var(--muted); }
        .file-link:hover .file-name { color: var(--accent); }
        .file-name { font-size: 13px; overflow-wrap: anywhere; }
        .file-desc { color: var(--muted); font-size: 12px; }
        .evidence .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .stat-value { font-size: 22px; font-weight: 600; letter-spacing: -.5px; }
        .stat-label { color: var(--secondary); font-size: 12px; }
        .key-values { margin: 0; }
        .key-values > div { display: flex; gap: 12px; justify-content: space-between; padding: 7px 0; }
        .key-values dt { color: var(--secondary); }
        .key-values dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
        .callout {
            padding: 13px 15px; border-radius: 8px; background: var(--blue-soft);
            color: var(--blue); font-size: 13px; line-height: 1.7;
        }
        .callout.warn { color: var(--amber); background: var(--amber-soft); }
        .callout.bad { color: var(--red); background: var(--red-soft); }
        .callout.good { color: var(--accent); background: var(--accent-soft); }
        .callout .btn { margin-top: 10px; }
        .toolbar {
            display: flex; align-items: center; gap: 9px; padding-bottom: 13px;
            border-bottom: 1px solid var(--line); margin-bottom: 18px;
        }
        .segmented { display: inline-flex; padding: 3px; background: var(--soft); border-radius: 7px; }
        .segmented button { padding: 4px 10px; border-radius: 5px; color: var(--secondary); }
        .segmented button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px #0001; }
        .toolbar .search { margin-left: auto; max-width: 152px; }
        .toolbar .field { min-height: 32px; padding-top: 4px; padding-bottom: 4px; font-size: 12px; }
        .toolbar .search > .icon { width: 14px; top: 9px; }
        .activity { position: relative; padding-left: 33px; padding-bottom: 22px; }
        .activity:not(:last-child)::before {
            content: ""; position: absolute; left: 10px; top: 26px; bottom: 1px;
            border-left: 1px solid var(--line);
        }
        .activity-icon {
            position: absolute; left: 0; top: 2px; color: var(--accent); background: var(--surface);
        }
        .activity-icon .icon { width: 21px; height: 21px; }
        .activity-title { display: flex; align-items: baseline; gap: 12px; }
        .activity-title strong { font-weight: 550; }
        .activity-title time { margin-left: auto; color: var(--muted); font-size: 12px; }
        .activity p { color: var(--secondary); margin-top: 4px; font-size: var(--content-secondary); }
        .activity details { margin-top: 8px; }
        .activity.compact { padding-bottom: 15px; }
        .activity.compact details { margin-top: 0; }
        .activity.compact summary { font-size: 14px; color: var(--ink); }
        .activity.compact .detail-text { margin-top: 12px; }
        .activity .terminal-output { max-height: 190px; }
        .recovery-strip {
            display: flex; gap: 9px; align-items: center; padding: 8px 12px;
            background: var(--amber-soft); color: var(--amber); border-radius: 6px;
            margin: 0 0 10px; font-size: 13px;
        }
        .stage.invalidated .stage-code { color: var(--amber); }
        .stage.invalidated .stage-mark { border-style: dashed; }
        .mobile-track { display: none; }
        .executor-steps { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .execution-focus {
            display: grid; grid-template-columns: 190px minmax(0, 1fr) auto;
            gap: 12px; align-items: center; padding: 0 0 12px; margin-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }
        .execution-focus select {
            min-height: 34px; padding: 5px 9px; background: var(--surface); color: var(--ink);
        }
        .execution-caption {
            display: flex; align-items: center; gap: 8px; text-align: left;
            min-width: 0; padding: 4px 0; color: var(--secondary);
        }
        .execution-caption strong {
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            font-size: 14px; font-weight: 500; line-height: 22px;
        }
        .execution-caption .icon { width: 13px; height: 13px; color: var(--muted); }
        .execution-caption:hover { color: var(--accent); }
        .execution-meta {
            grid-column: 3; font-size: 12px; color: var(--muted); white-space: nowrap;
        }
        .execution-focus.with-detail { grid-template-columns: 166px minmax(0, 1fr) auto; }
        .execution-identity { font-size: 14px; font-weight: 500; }
        .execution-tabs { display: flex; gap: 3px; }
        .execution-tabs button {
            font-size: 13px; line-height: 22px; padding: 5px 9px; border-radius: 5px;
        }
        .execution-tabs button[aria-current="page"] {
            background: var(--accent-soft); color: var(--accent);
        }
        .execution-tabs button:hover { background: var(--soft); }
        .execution-item, .execution-columns {
            display: grid; grid-template-columns: 118px minmax(0, 1fr) 86px 16px;
            gap: 14px; align-items: center; text-align: left; width: 100%;
        }
        .execution-columns { padding: 7px 8px; color: var(--muted); font-size: 12px; }
        .execution-item { padding: 14px 8px; border-bottom: 1px solid var(--line); }
        .execution-item:hover { background: var(--bg); }
        .execution-item > span { min-width: 0; }
        .execution-item strong { display: block; font-size: 14px; font-weight: 500; }
        .execution-item small { display: block; color: var(--muted); line-height: 20px; }
        .execution-item .execution-title, .execution-item .execution-latest {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .execution-item > .icon { width: 14px; color: var(--muted); }

        .execution-note { font-size: 12px; color: var(--muted); margin: 12px 0; }

        .execution-checks { margin: 18px 0; }

            padding: 10px 0; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--line); font-size: 13px;
        }
        .execution-check > span:first-child { flex: 1; }
        .execution-event {
            padding: 13px 0; border-bottom: 1px solid var(--line);
            display: grid; grid-template-columns: 22px minmax(0, 1fr) auto;
            gap: 10px; align-items: start;
        }
        .execution-event > .icon { margin-top: 2px; color: var(--accent); width: 16px; }

            margin-top: 4px; font-size: var(--content-secondary); color: var(--secondary);
        }
        .execution-event .event-scope { margin-bottom: 3px; font-size: 12px; color: var(--muted); }
        .project-filter { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .filter-bar .project-filter select { width: 215px; }
        .filter-bar { flex-wrap: wrap; gap: 12px; }
        .filter-bar .search { flex: 1; min-width: 200px; }
        .filter-result { margin: -8px 0 16px; font-size: 12px; color: var(--secondary); }
        .connection-row { padding: 18px 0; border-bottom: 1px solid var(--line); }
        .connection-row:last-child { border: 0; }
        .connection-row .connection-host { overflow-wrap: anywhere; }
        .project-origin { overflow-wrap: anywhere; font-size: 12px; color: var(--secondary); }
        .provider-note { padding: 12px 14px; border-radius: 7px; background: var(--bg); }

            .execution-focus { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
            .execution-focus select { max-width: 190px; }
            .execution-meta { grid-column: 2; grid-row: 1; }
            .execution-caption { grid-column: 1 / -1; grid-row: 2; }
            .execution-focus.with-detail { grid-template-columns: minmax(0, 1fr) auto; }
            .with-detail .execution-tabs { grid-column: 1 / -1; grid-row: 3; }

                            ${button("提交意见并重做", "confirm-rework", "primary")}</div>`); break;
                case "confirm-rework": {
                    const field = document.getElementById("rework-comment");
                    if (!field.value.trim() || !field.reportValidity()) { field.focus(); break; }
                    state.comment = field.value.trim();
                    state.reviews.push({ stage: state.current, decision: "reject",
                        comment: state.comment, revision: state.revision, at: new Date().toISOString() });
                    start_rerun(state.current); state.comment = ""; break;
                }
                case "check-artifacts":
                    target.disabled = true; target.textContent = "正在检查…";
                    await delay_action(700, () => {
                        Object.assign(state, { status: "review", scene: "review", stage: "P6" });
                        render(); toast("样例产物已就绪，机器校验通过");
                    }); break;
                case "reconnect":
                    target.disabled = true; target.textContent = "正在同步…";
                    await delay_action(600, () => {
                        state.offline = false; render(); toast("已恢复连接并补齐样例记录");
                    }); break;
                case "retry-log": state.log_error = false; render(); toast("执行日志已恢复"); break;
                case "retry-file": state.read_error = false; render(); break;
                case "advance":
                    if (state.offline) { toast("请先恢复连接，再推进演示"); break; }
                    if (state.status === "review") { toast("当前停在复核门，请先通过或打回"); break; }
                    if (state.status !== "running") { toast("请切换到执行中场景，或从指定阶段重新开始"); break; }
                    if (state.instance_mode && state.current === "P6" && advance_executions()) break;
                    if (state.review_mode !== "auto"
                        && (GATES.includes(state.current) || state.review_mode === "every")) {
                        state.status = "review"; state.scene = GATES.includes(state.current)
                            ? ({ P5: "plan", P6: "review", P9: "audit", P11: "delivery" })[state.current]
                            : state.scene;
                        if (state.follow_stage) state.stage = state.current;
                        render(); toast("阶段产物已就绪，等待复核");
                    } else move_next();
                    break;
                case "stage-settings":
                    state.return_to = { page: state.page, tab: state.tab, stage: state.stage };
                    state.page = "settings"; state.settings_tab = "prompts";
                    state.prompt_stage = state.stage; state.prompt_role = ""; render(); break;
                case "return-settings":
                    Object.assign(state, state.return_to || { page: "task" });
                    state.return_to = null; render(); break;
                case "settings-tab": state.settings_tab = value; render(); break;
                case "prompt-stage": state.prompt_stage = value; state.prompt_role = ""; render(); break;
                case "prompt-role": state.prompt_role = value; render(); break;
                case "reset-prompt":
                    if (state.draft.prompts[state.prompt_stage]) {
                        delete state.draft.prompts[state.prompt_stage][state.prompt_role];
                    }
                    state.dirty = true; render(); toast("已恢复当前提示词默认内容，保存后生效"); break;
                case "save-settings":
                    if (!(Number(state.draft.timeout) >= 1 && Number(state.draft.timeout) <= 240)) {
                        toast("执行超时应在 1–240 分钟之间"); break;
                    }
                    if (state.scene === "settings_error") {
                        state.scene = "running";
                        state.settings_error = "保存失败，修改草稿已保留。请重试保存。";
                        state.dirty = true; render(); break;
                    }
                    {
                        const previous = structuredClone(settings);
                        Object.assign(settings, structuredClone(state.draft));
                        if (!save_preferences()) {
                            Object.assign(settings, previous);
                            state.settings_error = "本地存储不可用，设置未保存，草稿仍保留。";
                            state.dirty = true; render(); break;
                        }
                    }
                    state.settings_error = ""; state.dirty = false;
                    render(); toast("设置已保存到 V9 本地原型"); break;
                case "probe":
                case "probe-fail":
                    state.probe = "running"; state.probe_version = state.draft.executor; render();
                    await delay_action(800, () => {
                        if (state.probe_version !== state.draft.executor) return;
                        state.probe = action === "probe-fail" ? "failed" : "success"; render();
                    }); break;
                case "test-connection":
                    target.disabled = true; target.textContent = "正在检查…";
                    await delay_action(600, () => {
                        const connection = state.connections.find((item) => item.host === value);
                        render(); toast(connection?.status === "已连接" ? "样例仓库连接检查通过"
                            : "连接已停用，请启用后重试");
                    }); break;
                case "manage-connection":
                    open_connection_dialog(value); break;
                case "save-connection": {
                    const form = document.getElementById("connection-form");
                    if (!form.reportValidity()) break;
                    const kind = form.elements.kind.value;
                    const host = form.elements.host.value.trim().replace(/^https?:\/\//, "")
                        .split("/")[0].toLowerCase();
                    const username = form.elements.username.value.trim();
                    const conflict = state.connections.find((item) => item.host === host && item.kind !== kind);
                    if (!/^[a-z0-9.-]+$/.test(host) || (kind === "github" && host !== "github.com")
                        || (kind === "codearts" && !username) || conflict) {
                        document.getElementById("connection-error").textContent = conflict
                            ? "此域名已有其他类型连接，请使用对应平台。"
                            : "请检查域名；GitHub 使用 github.com，CodeArts 需要 HTTPS 用户名。";
                        break;
                    }
                    state.connections = state.connections.filter((item) => item.host !== host);
                    state.connections.push({ kind, host, username, status: form.elements.status.value });
                    close_dialog(); render(); toast("连接配置已保存到当前原型"); break;
                }
                case "new-project": open_project_dialog(); break;
                case "project-failure":
                    document.getElementById("project-check").innerHTML = '<span style="color:var(--red)">'
                        + "连接失败：无法访问仓库，请检查仓库地址与读取权限后重试。</span>"; break;
                case "connect-project": await connect_project(target); break;
                case "project-tasks":
                    state.task_project = value; state.task_search = ""; state.task_filter = "all";
                    navigate_page("tasks"); break;
                case "new-task": open_task_dialog(); break;
                case "create-task": await create_task(target); break;
                case "source-failure":
                    document.getElementById("task-check").innerHTML = '<span style="color:var(--red)">'
                        + "Issue 读取失败：仓库可能为私有仓库或连接权限不足。请检查地址与连接后重试。</span>"; break;
                case "task-filter": state.task_filter = value; render(); break;
                case "open-run":
                    remember_task();
                    if (task_snapshots.has(value)) Object.assign(state,
                        structuredClone(task_snapshots.get(value)));
                    state.page = "task";
                    if (state.status === "completed") state.tab = "delivery";
                    render(); break;
                case "assistant": show_assistant(); break;
                case "ask-assistant": {
                    const question = document.getElementById("assistant-question").value.trim();
                    if (!question) break;
                    state.assistant.push({ role: "user", text: question }, { role: "assistant",
                        text: "这段原型不会调用模型。你可以根据当前阶段的产物、日志与验证记录判断结果。"
                            + "涉及修复或继续执行，请使用工作台中对应的复核与恢复操作。" });
                    show_assistant(); break;
                }
                default: toast("该操作尚不可用");
            }
        }
        function current_log() {
            if (state.page === "task" && state.stage === "P6" && state.tab === "process"
                && state.instance_mode && execution_selection()) {
                const { instance, revision } = execution_selection();
                return execution_console(instance, revision);
            }
            if (state.stage === "P8") return test_output(task_test_failed(), test_finished());
            if (state.old_from !== null && state.current === "P6" && !is_implementation_ready()) {
                return file_records().find(record => record.path === "06-implementation/external-exec.log")?.content || "正在准备本轮输出";
            }
            return state.log_mode === "raw" ? file_records().find((record) =>
                record.path.endsWith("external-exec.log"))?.content || "暂无日志"
                : test_output(false, is_implementation_ready());
        }
        async function connect_project(target) {
            const form = document.getElementById("project-form");
            if (!form.reportValidity()) return;
            const repository = parse_repository(form.elements.repo.value);
            const error = document.getElementById("project-check");
            if (!repository) {
                error.textContent = "请输入有效的 HTTPS 或 SSH 克隆地址；不要在地址中包含密码。";
                return;
            }
            const kind = form.elements.kind.value === "auto"
                ? detect_provider(repository) : form.elements.kind.value;
            if (kind === "github" && repository.host !== "github.com") {
                error.textContent = "此域名不是 github.com，请选择实际的托管平台。";
                return;
            }
            const duplicate = state.projects.find((project) =>
                project.host === repository.host && project.repo === repository.repo);
            if (duplicate) { error.textContent = "此仓库已连接为 " + duplicate.name + "。"; return; }
            const name = form.elements.name.value.trim() || repository.repo.split("/").at(-1);
            if (state.projects.some((project) => project.name.toLowerCase() === name.toLowerCase())) {
                error.textContent = "项目名称已存在，请使用不同的名称。"; return;
            }
            const auth = form.elements.auth.value;
            target.disabled = true; target.textContent = "正在检查…";
            await delay_action(650, () => {
                if (!form.isConnected || !document.getElementById("modal").open) return;
                state.projects.push({ ...repository, name, kind, auth });
                state.project = name; state.page = "projects";
                close_dialog(); render(); toast("项目已连接到 V9 本地原型");
            });
        }
        async function create_task(target) {
            const form = document.getElementById("task-form");
            if (!form.reportValidity()) return;
            const project = project_info(form.elements.project.value);
            const use_issue = form.elements.source_mode.value === "issue";
            const source = use_issue ? form.elements.source.value.trim() : form.elements.document.value.trim();
            const error = document.getElementById("task-check");
            let issue = "需求";
            if (use_issue) {
                let address;
                try { address = new URL(source); } catch { error.textContent = "请输入完整的 Issue 链接。"; return; }
                const suffix = project.kind === "gitlab" ? "/-/issues/" : "/issues/";
                const prefix = "/" + project.repo + suffix;
                const number = address.pathname.startsWith(prefix) ? address.pathname.slice(prefix.length) : "";
                if (!PROVIDERS[project.kind].issue || address.hostname !== project.host
                    || !/^\d+\/?$/.test(number)) {
                    error.textContent = "Issue 链接与所选项目不匹配，请检查项目或改用需求文档。";
                    return;
                }
                issue = number.replace(/\/$/, "");
            }
            const title = form.elements.title.value.trim();
            if (!title) { error.textContent = "请填写任务标题。"; return; }
            target.disabled = true; target.textContent = "正在准备任务…";
            await delay_action(700, () => {
                if (!form.isConnected || !document.getElementById("modal").open) return;
                remember_task();
                Object.assign(state, {
                    task_id: "run_" + Date.now(), issue, title, source,
                    project: project.name, run_project: project.name,
                    executor: settings.executor, review_mode: settings.review,
                    instance_mode: settings.executor !== "session", executor_output: "output",
                    recovery: null, history_files: [], executions: create_executions(), executor_view: "all",
                    execution_history: [], executor_tab: "process", executor_attempt: "current",
                    current: "P1", stage: "P1", status: "running", page: "task", tab: "process",
                    scene: "running", revision: 1, old_from: null, completed_stages: [],
                    reviews: [], comment: "", error: "", follow_stage: true, offline: false,
                    new_task: true, deleted_task: null, evidence_open: false, instance_filter: "all", instance_search: "",
                    file_revision: "current", file_trees: {}, file_search: "", file_browser_open: false,
                    terminal_search: "", log_follow: {},
                });
                if (state.instance_mode) {
                    if (settings.executor !== "builtin") state.executions.instances = state.executions.instances.slice(0, 1);
                    state.executions.limit = Math.min(state.executions.limit, state.executions.instances.length);
                    state.executions.instances.forEach((instance) => {
                        instance.engine = settings.executor;
                        delete instance.command;
                    });
                    state.executions = reset_executions(state.executions);
                }
                close_dialog(); render(); toast("任务已创建，开始需求分析演示");
            });
        }
        document.addEventListener("click", (event) => {
            const target = event.target.closest("[data-action]");
            if (!target || target.disabled) return;
            event.preventDefault();
            handle_action(target.dataset.action, target.dataset.value || "", target).catch((error) => {
                console.error("V9 原型操作失败", error);
                state.pending = false;
                toast("操作未完成，请重试：" + error.message);
            });
        });
        document.addEventListener("input", (event) => {
            const target = event.target;
            const field = target.dataset.field;
            if (field === "repository-address") update_repository_hint();
            if (target.dataset.setting) {
                state.draft[target.dataset.setting] = target.value;
                state.dirty = true;
                if (target.dataset.setting === "executor") state.probe = "idle";
                const indicator = document.querySelector(".settings-save span");
                if (indicator) indicator.textContent = "有未保存的修改";
            }
            if (field === "review-comment") state.comment = target.value;
            if (field === "prompt-content") {
                state.draft.prompts[state.prompt_stage] ||= {};
                state.draft.prompts[state.prompt_stage][state.prompt_role] = target.value;
                state.dirty = true;
                const indicator = document.querySelector(".settings-save span");
                if (indicator) indicator.textContent = "有未保存的修改";
            }
            const searches = { "log-search": "log_search", "file-search": "file_search",
                "task-search": "task_search", "instance-search": "instance_search", "terminal-search": "terminal_search" };
            if (searches[field]) { state[searches[field]] = target.value; render(); }
            if (field === "rerun-stage") {
                document.getElementById("rerun-impact").textContent = rerun_impact(target.value);
            }
        });
        document.addEventListener("change", (event) => {
            const field = event.target.dataset.field;
            if (field === "file-revision") {
                const previous_path = state.file.replace(/^history\/r\d+\//, "");
                const owner = selected_tree_file() && file_owner(selected_tree_file());
                state.file_revision = event.target.value; state.file_search = ""; state.read_error = false; state.file_page = 0;
                const records = file_tree_records();
                const previous_view = state.file_trees?.[file_tree_key()];
                const view = file_tree_view(records);
                if (!previous_view) {
                    const corresponding = records.find(file => file.path.replace(/^history\/r\d+\//, "") === previous_path);
                    if (corresponding) {
                        view.selected = corresponding.path;
                        const group = file_group(corresponding);
                        view.open = [...new Set([...view.open, group, ...(owner ? [group + ":" + owner] : [])])];
                    }
                }
                state.file = view.selected;
                file_reveal = { path: state.file }; render();
            }
            if (field === "execution-select") {
                state.executor_view = event.target.value; state.executor_attempt = "current";
                state.executor_output = "output"; state.terminal_search = ""; render();
            }
            if (field === "execution-attempt") { state.executor_attempt = event.target.value; render(); }
            if (field === "task-project") { state.task_project = event.target.value; render(); }
            if (field === "repository-kind") update_repository_hint();
            if (field === "new-task-project") update_task_source(true);
            if (field === "source-mode") update_task_source();
            if (field === "connection-kind") {
                const form = document.getElementById("connection-form");
                const kind = event.target.value;
                form.elements.host.value = PROVIDERS[kind].host;
                document.getElementById("connection-user-label").hidden = kind !== "codearts";
                document.getElementById("credential-label").textContent = PROVIDERS[kind].credential;
            }
            if (event.target.dataset.setting === "executor") render();
        });
        document.addEventListener("submit", (event) => {
            event.preventDefault();
            const action = ({ "project-form": "connect-project", "task-form": "create-task",
                "connection-form": "save-connection" })[event.target.id];
            event.target.querySelector(`[data-action="${action}"]`)?.click();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && event.target.id === "assistant-question") {
                document.querySelector('[data-action="ask-assistant"]')?.click();
            }
        });
        document.getElementById("modal").addEventListener("close", () => {
            if (modal_return) document.querySelector(`[data-action="${modal_return}"]`)?.focus({ preventScroll: true });
        });
        document.addEventListener("scroll", (event) => {
            const terminal = event.target;
            if (restoring_scroll || !terminal.matches?.("#app .terminal-output") || state.terminal_search) return;
            if (terminal.scrollTop + terminal.clientHeight < terminal.scrollHeight - 8 && follows_log()) {
                state.log_follow[output_key()] = false;
                const control = document.querySelector('.terminal-tools [data-action="follow-log"]');
                if (control) { control.textContent = "返回最新 ↓"; control.setAttribute("aria-pressed", "false"); }
            }
        }, { passive: true, capture: true });
        const query = new URLSearchParams(location.search);
        let previous_session;
        try { previous_session = JSON.parse(sessionStorage.getItem(STORAGE_KEY + "-session") || "null"); }
        catch { previous_session = null; }
        const original_address = location.href;
        set_scene(query.get("scene") || "parallel_many", false);
        if (["projects", "tasks", "task", "files", "settings"].includes(query.get("view"))) {
            state.page = query.get("view");
        }
        if (ALL_STAGES.some(([stage]) => stage === query.get("stage"))) state.stage = query.get("stage");
        if (["process", "changes", "delivery"].includes(query.get("tab"))) state.tab = query.get("tab");
        if (query.get("project") === "all" || state.projects.some((project) => project.name === query.get("project"))) {
            state.task_project = query.get("project");
        }
        if (["light", "dark"].includes(query.get("theme"))) state.theme = query.get("theme");
        if (performance.getEntriesByType("navigation")[0]?.type === "reload"
            && previous_session?.version === 2 && previous_session.url === original_address) {
            Object.assign(state, previous_session.state, { pending: false });
            if (state.status === "stopping") state.status = "stopped";
            task_snapshots.clear();
            previous_session.tasks.forEach(([key, value]) => task_snapshots.set(key, value));
        }
        render();
    </script>
</body>
</html>
